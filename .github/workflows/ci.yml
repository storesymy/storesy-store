name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests keep the fast cancel-stale-checks behaviour. Pushes to main
# and manual deploys share one serialized group so accounts are never deployed
# out of order.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Repo policy: tests exist only for critical system uptime (and money logic,
      # once it exists). No coverage targets, no per-feature tests.
      - name: Uptime tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 3
          if-no-files-found: error

      # Catches config-renderer drift before the matrix ever touches an account.
      - name: Validate account config renderer
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: 0123456789abcdef0123456789abcdef
          WORKER_NAME: storesy-api
          D1_DATABASE_ID: 11111111-1111-1111-1111-111111111111
          KV_NAMESPACE_ID: 22222222222222222222222222222222
          R2_BUCKET_NAME: storesy-images
          WEB_ORIGIN: https://smbiz.pages.dev
          WORKERS_SUBDOMAIN: smbiz
        run: |
          node scripts/render-wrangler.mjs
          npx wrangler deploy --dry-run --config wrangler.deploy.jsonc
          rm -f wrangler.deploy.jsonc

      # Migrations are append-only: editing or deleting an already-shipped
      # migration rewrites history for every environment that applied it.
      - name: Migration guard (applied migrations are immutable)
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --diff-filter=MD --name-only "origin/${{ github.base_ref }}" HEAD -- 'apps/api/db/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations were modified or deleted:"
            echo "$changed"
            echo "Revert the change and add a NEW migration instead (drizzle-kit generate)."
            exit 1
          fi

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: checks
    # Deploy only from main — both pushes and manual dispatch.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        environment:
          - smbiz
          # Add the other accounts after their GitHub Environment and
          # Cloudflare resources exist:
          # - kakbelle
          # - kdh
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      PAGES_BRANCH: ${{ vars.PAGES_BRANCH || 'main' }}
      INTEGRATIONS_KEY: ${{ secrets.INTEGRATIONS_KEY }}
      INTEGRATIONS_KEY_PREV: ${{ secrets.INTEGRATIONS_KEY_PREV }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Verify frontend artifact
        run: test -f apps/frontend/dist/index.html

      # Fail before migrations/deploys if the GitHub Environment is incomplete.
      - name: Validate account environment
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN WORKER_NAME D1_DATABASE_ID KV_NAMESPACE_ID R2_BUCKET_NAME PAGES_PROJECT_NAME WORKERS_SUBDOMAIN WEB_ORIGIN INTEGRATIONS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from the ${{ matrix.environment }} environment."
              missing=1
            fi
          done
          exit "$missing"

      # The committed wrangler.jsonc keeps local-development placeholders.
      # This step writes the account's real IDs to a gitignored config.
      - name: Render account config
        working-directory: apps/api
        env:
          # Optional overrides for custom domains; otherwise derived from
          # PAGES_PROJECT_NAME and WORKERS_SUBDOMAIN.
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: npm run deploy:config

      # Migrations first: new code must never run against a schema it expects
      # but that has not been applied yet.
      - name: Apply D1 migrations (remote, append-only)
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Deploy API Worker
        working-directory: apps/api
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Set Worker secrets
        working-directory: apps/api
        run: |
          if [ -z "$INTEGRATIONS_KEY" ]; then
            echo "::error::INTEGRATIONS_KEY is missing from the ${{ matrix.environment }} environment."
            exit 1
          fi
          printf '%s' "$INTEGRATIONS_KEY" | npx wrangler secret put INTEGRATIONS_KEY --config wrangler.deploy.jsonc
          if [ -n "$INTEGRATIONS_KEY_PREV" ]; then
            printf '%s' "$INTEGRATIONS_KEY_PREV" | npx wrangler secret put INTEGRATIONS_KEY_PREV --config wrangler.deploy.jsonc
          elif npx wrangler secret list --config wrangler.deploy.jsonc 2>/dev/null | grep -q 'INTEGRATIONS_KEY_PREV'; then
            # Removed from GitHub after a rotation — drop it from the Worker too.
            npx wrangler secret delete INTEGRATIONS_KEY_PREV --config wrangler.deploy.jsonc
          fi

      # The root Pages Function forwards /api/* and page paths to the Worker.
      # API_ORIGIN was derived by the render step.
      - name: Point Pages at the API
        working-directory: apps/frontend
        run: printf '%s' "$API_ORIGIN" | npx wrangler pages secret put API_ORIGIN --project-name "$PAGES_PROJECT_NAME"

      - name: Deploy frontend to Pages
        working-directory: apps/frontend
        run: >-
          npx wrangler pages deploy dist
          --project-name "$PAGES_PROJECT_NAME"
          --branch "$PAGES_BRANCH"
          --commit-hash "$GITHUB_SHA"

      - name: Health check
        run: |
          health_url="${WEB_ORIGIN%%,*}"
          for attempt in $(seq 1 20); do
            if curl -fsS "$health_url/api/health" >/dev/null; then
              echo "Healthy: $health_url"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed for $health_url"
          exit 1
