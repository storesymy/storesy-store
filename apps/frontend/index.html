<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Storesy — run your store from one place." />
    <link rel="icon" type="image/png" href="/storesy-icon.png" />
    <title>Storesy</title>
    <script>
      // Apply the stored theme before first paint so the page never flashes.
      // Light is the default; dark is only used when the user opted in.
      (function () {
        try {
          var t = localStorage.getItem("storesy-theme");
          document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
